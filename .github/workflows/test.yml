name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # 실제 PostgreSQL 을 붙여 DB 백엔드 테스트를 강제 실행한다(‘DB 테스트 skip 금지’).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mori
          POSTGRES_PASSWORD: pg
          POSTGRES_DB: mori_soc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mori"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      PYTHONPATH: src
      MORI_QUERY_BACKEND: postgres
      MORI_DATABASE_URL: postgresql://mori:pg@localhost:5432/mori_soc
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (single source — pyproject)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff — config in pyproject)
        run: ruff check src tests

      - name: Unit + integration tests (Postgres-backed)
        run: python -m unittest discover -s tests -p "test_*.py" -v

      # DB E2E 가 실제로 실행됐는지 강제 검증 — DB 미가용으로 통째 스킵되면 CI 실패(silent skip 방지).
      # (‘no alerts seeded’ 같은 데이터 조건부 스킵은 정상 — postgres/psycopg 미가용 스킵만 잡는다.)
      - name: DB E2E must run (fresh install · migration · state persistence)
        run: |
          set -o pipefail
          python -m unittest -v \
            tests.test_migration_e2e \
            tests.test_state_persistence \
            tests.test_risk_register_persistence 2>&1 | tee db_e2e.log
          if grep -qiE "skipped.*(postgres|psycopg|MORI_QUERY_BACKEND|MORI_DATABASE_URL)" db_e2e.log; then
            echo "::error::DB E2E tests skipped for lack of PostgreSQL — enforcement is broken"; exit 1
          fi
          grep -qE "^OK" db_e2e.log || { echo "::error::DB E2E did not pass"; exit 1; }

  catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Validate control catalog (schema + cross-references)
        run: python controls/validate.py

      - name: Verify runtime JSON is in sync with YAML
        # Rebuild the committed artifact; fail if it differs (someone edited YAML
        # without re-running controls/_build_catalog_json.py).
        run: |
          python controls/_build_catalog_json.py
          git diff --exit-code -- src/mori_soc/data/controls_catalog.json \
            || { echo "::error::controls_catalog.json is stale — run 'python controls/_build_catalog_json.py' and commit"; exit 1; }

  build:
    # Dockerfile 이 실제로 빌드되는지 검증(배포 전 이미지 깨짐 방지).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build MORI image
        run: docker build -t mori-soc:ci .

      # 고칠 수 있는 CRITICAL 취약점이 있으면 CI 실패(수용 위험은 .trivyignore 에 사유·만료와 함께).
      - name: Trivy image scan — fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mori-soc:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: "true"
          trivyignores: .trivyignore
          format: sarif
          output: trivy-results.sarif
          exit-code: "1"

      # HIGH 는 경고(informational) + 결과 아티팩트 보존.
      - name: Trivy image scan — HIGH (informational)
        if: always()
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: mori-soc:ci
          scanners: vuln
          severity: HIGH
          ignore-unfixed: "true"
          exit-code: "0"

      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

  deps:
    # 의존성 취약점 스캔(informational — 권고 발생 시 CI 를 막지 않되 로그로 노출).
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: pip-audit (dependency vulnerabilities)
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
          pip-audit --progress-spinner off || true
