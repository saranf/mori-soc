name: code-review-semgrep

# 무료 오픈소스 SAST(Semgrep)로 기존 코드 전체 스캔 → 결과(SARIF)를 MORI로 전송.
# Claude fullscan(유료 API)의 무료 대안. MORI는 SARIF를 그대로 파싱한다(코드 변경 없음).
# 준비물: 이 파일 1개 + 레포 Secret 1개(MORI_INGEST_URL).  ← ANTHROPIC 키 불필요!
on:
  workflow_dispatch:            # MORI UI 원격 실행 / 수동 실행
    inputs:
      mori_ingest_url:
        description: "MORI ingest base URL (원격 트리거 시 자동 주입)"
        required: false
        default: ""
  # 정기 베이스라인(월 1회) — 필요하면 주석 해제:
  # schedule:
  #   - cron: "0 0 1 * *"

permissions:
  contents: read
  id-token: write               # GitHub OIDC — MORI 위조 불가 provenance

jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Semgrep scan (free OSS rules + MORI PII rules)
        env:
          MORI_INGEST_URL: ${{ github.event.inputs.mori_ingest_url || secrets.MORI_INGEST_URL }}
        run: |
          python3 -m pip install --quiet semgrep
          # 개인정보(PII) 룰 = MORI 가 서빙(기본셋 + 어드민 커스텀 기준). 스캔 때 최신본을 가져온다.
          # MORI 미도달 시 최소 리터럴 룰(주민번호·휴대폰·카드)로 폴백.
          [ -n "$MORI_INGEST_URL" ] && curl -fsS "${MORI_INGEST_URL%/}/privacy/pii-rules.yml" -o .mori-pii.yml || true
          if [ ! -s .mori-pii.yml ]; then
            cat > .mori-pii.yml <<'RULES'
          rules:
            - id: korean-pii-rrn
              languages: [generic]
              severity: WARNING
              message: "주민등록번호로 보이는 값이 하드코딩됨 (개인정보)"
              patterns:
                - pattern-regex: '\b\d{6}[-\s]?[1-4]\d{6}\b'
            - id: korean-pii-phone
              languages: [generic]
              severity: INFO
              message: "휴대폰번호로 보이는 값이 하드코딩됨 (개인정보)"
              patterns:
                - pattern-regex: '\b01[016789][-\s]?\d{3,4}[-\s]?\d{4}\b'
            - id: korean-pii-card
              languages: [generic]
              severity: WARNING
              message: "카드번호로 보이는 값이 하드코딩됨 (개인정보)"
              patterns:
                - pattern-regex: '\b\d{4}[-\s]\d{4}[-\s]\d{4}[-\s]\d{4}\b'
          RULES
          fi
          # auto: 공개 무료 룰 + p/secrets: 하드코딩 비밀 + MORI PII 룰(값·필드명·어드민 기준).
          semgrep scan --config auto --config p/secrets --config .mori-pii.yml \
            --exclude .mori-pii.yml --sarif --output semgrep.sarif . || true
          echo "SARIF size: $(wc -c < semgrep.sarif 2>/dev/null || echo 0) bytes"
      - name: Push results to MORI
        continue-on-error: true
        env:
          MORI_INGEST_URL: ${{ github.event.inputs.mori_ingest_url || secrets.MORI_INGEST_URL }}
          MORI_INGEST_TOKEN: ${{ secrets.MORI_INGEST_TOKEN }}
        run: |
          [ -z "$MORI_INGEST_URL" ] && { echo "MORI_INGEST_URL 미설정 — 스킵"; exit 0; }
          [ -f semgrep.sarif ] || { echo "SARIF 없음 — 스킵"; exit 0; }
          # OIDC 토큰(권장) — 정적 토큰 없이 서명 검증
          OIDC=""
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            OIDC=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=mori-ingest" | jq -r '.value // empty')
          fi
          HDR=(-H "Content-Type: application/json")
          [ -n "$MORI_INGEST_TOKEN" ] && HDR+=(-H "Authorization: Bearer ${MORI_INGEST_TOKEN}")
          [ -n "$OIDC" ] && HDR+=(-H "X-MORI-OIDC: ${OIDC}")
          echo "MORI로 SARIF push (${GITHUB_REPOSITORY}@${GITHUB_SHA})…"
          curl -fsS -X POST \
            "${MORI_INGEST_URL%/}/ingest/code-review?repo=${GITHUB_REPOSITORY}&commit=${GITHUB_SHA}&run_id=${GITHUB_RUN_ID}" \
            "${HDR[@]}" \
            --data-binary "@semgrep.sarif"
          echo; echo "pushed."
