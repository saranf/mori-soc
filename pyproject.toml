[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mori-soc"
version = "0.6.0"
description = "MORI SOC — self-hosted audit-evidence layer for ISO 27001 / ISMS-P"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# 런타임 의존성 — 단일 출처(#31). Dockerfile·CI 는 이 목록을 설치한다(버전 중복/드리프트 제거).
dependencies = [
    "fastapi==0.115.12",
    "uvicorn==0.34.0",
    "psycopg[binary]==3.2.6",
    "ldap3==2.9.1",
    "httpx==0.28.1",
    "reportlab==4.2.5",
]

[project.optional-dependencies]
# 개발·CI 전용(런타임 아님): 카탈로그 검증(pyyaml)·린트(ruff)·의존성 스캔(pip-audit).
dev = [
    "pyyaml",
    "ruff",
    "pip-audit",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# 정적 자산(CSS 등)을 패키지에 포함(#34) — 비-editable 설치에서도 서빙되도록.
"mori_soc.api" = ["static/**/*"]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
# 치명 오류(구문·미정의) + import 정렬(I) + 버그베어(B, 잠재버그). 노이즈 큰 룰
# (E501 라인길이·RUF 한글 유니코드·F401/403 star-import)은 단계적 도입(백로그).
select = ["E9", "F63", "F7", "F82", "I", "B"]
# 방어적 광범위 except(감사·인제스트에서 의도적)와 대형 HTML/JS 문자열은 예외 처리.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# 테스트는 assert 패턴상 B011/B017 허용.
"tests/*" = ["B011", "B017"]

[tool.mypy]
# 점진 도입(#33): 이미 잘 타이핑된 핵심·보안 모듈만 게이트. 새 모듈은 files 에 추가한다.
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
files = [
    "src/mori_soc/api/errors.py",
    "src/mori_soc/api/metrics.py",
    "src/mori_soc/api/ratelimit.py",
    "src/mori_soc/services/csv_export.py",
    "src/mori_soc/services/evidence.py",
]
