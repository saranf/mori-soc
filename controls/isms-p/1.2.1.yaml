section: "1.2 위험 관리"
title_ko: "정보자산 식별"
title_en: "Information asset identification"
status: reviewed
intent_ko: "조직의 정보자산을 누락 없이 식별·목록화하고 중요도를 산정하여 최신 상태로 유지한다. 자산 식별이 부실하면 이후 모든 보호대책의 적용 범위가 불명확해진다."
intent_en: "Identify and inventory all information assets without omission, assess their importance, and keep the list current. Weak asset identification makes the scope of every downstream control unclear."
evidence_sources: [fleet, zabbix]
evidence_hint_ko: "Fleet(osquery) 자동 발견 호스트 + Zabbix 서버 자산의 대사(reconciliation) 결과. 수기 목록이 아닌 자동 수집·현행화된 자산 인벤토리."
evidence_hint_en: "Auto-discovered hosts from Fleet (osquery) + reconciliation against Zabbix server assets — an auto-collected, current asset inventory rather than a manual list."
mori_intents: [unmapped_assets, host_fleet_queries]
tags: [asset, foundation]
