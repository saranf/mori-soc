services:
  soc-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MORI_DB_NAME:-mori_soc}
      POSTGRES_USER: ${MORI_DB_USER:-mori}
      POSTGRES_PASSWORD: ${MORI_DB_PASSWORD:-mori}
    volumes:
      - mori-postgres-data:/var/lib/postgresql/data
      - ./schema/001_phase1_initial.sql:/docker-entrypoint-initdb.d/001_phase1_initial.sql:ro
      - ./schema/002_phase2_compliance_identity.sql:/docker-entrypoint-initdb.d/002_phase2_compliance_identity.sql:ro
      - ./schema/003_phase2_ui_operational_state.sql:/docker-entrypoint-initdb.d/003_phase2_ui_operational_state.sql:ro
      - ./schema/004_risk_register.sql:/docker-entrypoint-initdb.d/004_risk_register.sql:ro
      - ./schema/005_alert_resolved.sql:/docker-entrypoint-initdb.d/005_alert_resolved.sql:ro
      - ./schema/006_evidence_events.sql:/docker-entrypoint-initdb.d/006_evidence_events.sql:ro
      - ./schema/007_controls.sql:/docker-entrypoint-initdb.d/007_controls.sql:ro
      - ./schema/008_settings.sql:/docker-entrypoint-initdb.d/008_settings.sql:ro
      - ./schema/009_control_status.sql:/docker-entrypoint-initdb.d/009_control_status.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [soc]

  openldap:
    image: osixia/openldap:1.5.0
    restart: unless-stopped
    environment:
      LDAP_ORGANISATION: ${LDAP_ORG:-MORI SOC}
      LDAP_DOMAIN: ${LDAP_DOMAIN:-mori.local}
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
      LDAP_TLS: "false"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks: [soc]

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    restart: unless-stopped
    depends_on:
      - openldap
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: openldap
      PHPLDAPADMIN_HTTPS: "false"
    ports:
      - "${PHPLDAPADMIN_PORT:-18089}:80"
    networks: [soc]

  mori-api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      soc-postgres:
        condition: service_healthy
      openldap:
        condition: service_started
    environment:
      MORI_QUERY_BACKEND: postgres
      MORI_DATABASE_URL: postgresql://${MORI_DB_USER:-mori}:${MORI_DB_PASSWORD:-mori}@soc-postgres:5432/${MORI_DB_NAME:-mori_soc}
      # 세션 인증 / 관리자 계정 / 데모 모드 — 컨테이너에 전달(미전달 시 코드 기본값 사용)
      MORI_AUTH_ENABLED: ${MORI_AUTH_ENABLED:-true}
      MORI_ADMIN_PASSWORD: ${MORI_ADMIN_PASSWORD:-1234}
      MORI_DEMO_MODE: ${MORI_DEMO_MODE:-true}
      # Trivy 원격 인제스트 토큰 — 설정 시 에이전트/CSOP가 세션 없이 Bearer/X-MORI-Token 로 push
      MORI_INGEST_TOKEN: ${MORI_INGEST_TOKEN:-}
      # 데모 임팩트용 인메모리 시드(triage/asset owners/user profiles) — 운영에선 0으로 비활성화
      MORI_DEMO_SEED: ${MORI_DEMO_SEED:-1}
      MORI_GRAFANA_URL: ${GRAFANA_URL:-http://mori.rmstudio.co.kr:13000}
      MORI_ZABBIX_UI_URL: ${MORI_ZABBIX_UI_URL:-http://mori.rmstudio.co.kr:18081}
      MORI_FLEET_UI_URL: ${MORI_FLEET_UI_URL:-http://mori.rmstudio.co.kr:1337}
      MORI_WAZUH_UI_URL: ${MORI_WAZUH_UI_URL:-}
      # LDAP 인증 (활성화하려면 MORI_LDAP_ENABLED=true 설정)
      MORI_LDAP_ENABLED: ${MORI_LDAP_ENABLED:-false}
      MORI_LDAP_URL: ${MORI_LDAP_URL:-ldap://openldap:389}
      MORI_LDAP_BIND_DN: ${MORI_LDAP_BIND_DN:-cn=admin,dc=mori,dc=local}
      MORI_LDAP_BIND_PW: ${MORI_LDAP_BIND_PW:-admin}
      MORI_LDAP_BASE_DN: ${MORI_LDAP_BASE_DN:-ou=users,dc=mori,dc=local}
      MORI_LDAP_USER_ATTR: ${MORI_LDAP_USER_ATTR:-uid}
    ports:
      - "${MORI_API_PORT:-18000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [soc]

  # ── Unified worker (runs all enabled pollers in a single loop) ──
  mori-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # 브라운필드: 소스 연결은 .env(URL/creds)로만 결정. 번들 zabbix-web 에 의존하지
    # 않는다(외부 Zabbix 를 가리킬 수 있어야 함) → 폴러는 매 주기 재시도한다.
    depends_on:
      soc-postgres:
        condition: service_healthy
    command: ["python", "-m", "mori_soc.worker"]
    environment:
      MORI_DATABASE_URL: postgresql://${MORI_DB_USER:-mori}:${MORI_DB_PASSWORD:-mori}@soc-postgres:5432/${MORI_DB_NAME:-mori_soc}
      MORI_WORKER_INTERVAL_SECONDS: ${MORI_WORKER_INTERVAL_SECONDS:-60}
      MORI_ENABLE_ZABBIX: ${MORI_ENABLE_ZABBIX:-true}
      MORI_ZABBIX_API_URL: ${MORI_ZABBIX_API_URL:-http://zabbix-web:8080/api_jsonrpc.php}
      MORI_ZABBIX_API_TOKEN: ${MORI_ZABBIX_API_TOKEN:-}
      MORI_ZABBIX_USER: ${MORI_ZABBIX_USER:-Admin}
      MORI_ZABBIX_PASSWORD: ${MORI_ZABBIX_PASSWORD:-zabbix}
      MORI_ZABBIX_TIMEOUT_SECONDS: ${MORI_ZABBIX_TIMEOUT_SECONDS:-10}
      MORI_ZABBIX_HOST_LIMIT: ${MORI_ZABBIX_HOST_LIMIT:-500}
      MORI_ZABBIX_PROBLEM_LIMIT: ${MORI_ZABBIX_PROBLEM_LIMIT:-500}
      MORI_ENABLE_TRIVY: ${MORI_ENABLE_TRIVY:-false}
      MORI_TRIVY_REPORT_GLOB: ${MORI_TRIVY_REPORT_GLOB:-reports/trivy/*.json}
      MORI_ENABLE_LDAP_SYNC: ${MORI_ENABLE_LDAP_SYNC:-false}
      MORI_LDAP_URL: ${MORI_LDAP_URL:-ldap://openldap:389}
      MORI_LDAP_BIND_DN: ${MORI_LDAP_BIND_DN:-}
      MORI_LDAP_BIND_PASSWORD: ${MORI_LDAP_BIND_PASSWORD:-}
      MORI_LDAP_SYNC_BASE_DN: ${MORI_LDAP_SYNC_BASE_DN:-}
    networks: [soc]

  # ── Individual poller services (activate with: docker compose --profile pollers up) ──
  mori-poller-zabbix:
    profiles: ["pollers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # 브라운필드: 외부 Zabbix 를 가리킬 수 있어야 하므로 번들 zabbix-web 에 의존하지 않음.
    depends_on:
      soc-postgres:
        condition: service_healthy
    command: ["python", "-m", "mori_soc.pollers.zabbix"]
    environment:
      MORI_DATABASE_URL: postgresql://${MORI_DB_USER:-mori}:${MORI_DB_PASSWORD:-mori}@soc-postgres:5432/${MORI_DB_NAME:-mori_soc}
      MORI_WORKER_INTERVAL_SECONDS: ${MORI_WORKER_INTERVAL_SECONDS:-60}
      MORI_ENABLE_ZABBIX: ${MORI_ENABLE_ZABBIX:-true}
      MORI_ZABBIX_API_URL: ${MORI_ZABBIX_API_URL:-http://zabbix-web:8080/api_jsonrpc.php}
      MORI_ZABBIX_API_TOKEN: ${MORI_ZABBIX_API_TOKEN:-}
      MORI_ZABBIX_USER: ${MORI_ZABBIX_USER:-Admin}
      MORI_ZABBIX_PASSWORD: ${MORI_ZABBIX_PASSWORD:-zabbix}
      MORI_ZABBIX_TIMEOUT_SECONDS: ${MORI_ZABBIX_TIMEOUT_SECONDS:-10}
      MORI_ZABBIX_HOST_LIMIT: ${MORI_ZABBIX_HOST_LIMIT:-500}
      MORI_ZABBIX_PROBLEM_LIMIT: ${MORI_ZABBIX_PROBLEM_LIMIT:-500}
    networks: [soc]

  mori-poller-trivy:
    profiles: ["pollers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      soc-postgres:
        condition: service_healthy
    command: ["python", "-m", "mori_soc.pollers.trivy"]
    environment:
      MORI_DATABASE_URL: postgresql://${MORI_DB_USER:-mori}:${MORI_DB_PASSWORD:-mori}@soc-postgres:5432/${MORI_DB_NAME:-mori_soc}
      MORI_WORKER_INTERVAL_SECONDS: ${MORI_WORKER_INTERVAL_SECONDS:-60}
      MORI_ENABLE_TRIVY: ${MORI_ENABLE_TRIVY:-true}
      MORI_TRIVY_REPORT_GLOB: ${MORI_TRIVY_REPORT_GLOB:-reports/trivy/*.json}
    networks: [soc]

  mori-poller-ldap:
    profiles: ["pollers"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      soc-postgres:
        condition: service_healthy
    command: ["python", "-m", "mori_soc.pollers.ldap_sync"]
    environment:
      MORI_DATABASE_URL: postgresql://${MORI_DB_USER:-mori}:${MORI_DB_PASSWORD:-mori}@soc-postgres:5432/${MORI_DB_NAME:-mori_soc}
      MORI_WORKER_INTERVAL_SECONDS: ${MORI_WORKER_INTERVAL_SECONDS:-60}
      MORI_ENABLE_LDAP_SYNC: ${MORI_ENABLE_LDAP_SYNC:-true}
      MORI_LDAP_URL: ${MORI_LDAP_URL:-ldap://openldap:389}
      MORI_LDAP_BIND_DN: ${MORI_LDAP_BIND_DN:-}
      MORI_LDAP_BIND_PASSWORD: ${MORI_LDAP_BIND_PASSWORD:-}
      MORI_LDAP_SYNC_BASE_DN: ${MORI_LDAP_SYNC_BASE_DN:-}
      MORI_LDAP_SYNC_USER_FILTER: ${MORI_LDAP_SYNC_USER_FILTER:-(objectClass=user)}
      MORI_LDAP_SYNC_GROUP_FILTER: ${MORI_LDAP_SYNC_GROUP_FILTER:-(objectClass=group)}
      MORI_LDAP_SYNC_TIMEOUT_SECONDS: ${MORI_LDAP_SYNC_TIMEOUT_SECONDS:-10}
    networks: [soc]

  portal:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${PUBLIC_PORT:-37854}:80"
    volumes:
      - ./config/portal:/usr/share/nginx/html:ro
    networks: [soc]

  grafana:
    image: grafana/grafana-oss:11.5.2
    restart: unless-stopped
    depends_on:
      - loki
    environment:
      GF_SERVER_DOMAIN: ${PUBLIC_DOMAIN:-mori.rmstudio.co.kr}
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://mori.rmstudio.co.kr:13000}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-1234}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # LDAP 인증 (GRAFANA_LDAP_ENABLED=true 로 활성화)
      GF_AUTH_LDAP_ENABLED: ${GRAFANA_LDAP_ENABLED:-false}
      GF_AUTH_LDAP_CONFIG_FILE: /etc/grafana/ldap.toml
      GF_AUTH_LDAP_ALLOW_SIGN_UP: "true"
    ports:
      - "${GRAFANA_PORT:-13000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/ldap.toml:/etc/grafana/ldap.toml:ro
    networks: [soc]

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - loki-data:/loki
      - ./config/loki/config.yml:/etc/loki/config.yml:ro
    networks: [soc]

  fluent-bit:
    image: cr.fluentbit.io/fluent/fluent-bit:3.2.5
    restart: unless-stopped
    depends_on:
      - loki
    command: ["/fluent-bit/bin/fluent-bit", "-c", "/fluent-bit/etc/fluent-bit.conf"]
    volumes:
      - ./config/fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - /var/log:/host/var/log:ro
      - fleet-logs:/fleet-logs:ro
    networks: [soc]

  postgres:
    profiles: ["bundled", "zabbix"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
    volumes:
      - zabbix-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [soc]

  zabbix-server:
    profiles: ["bundled", "zabbix"]
    image: zabbix/zabbix-server-pgsql:alpine-7.4-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
    ports:
      - "10051:10051"
    networks: [soc]

  zabbix-web:
    profiles: ["bundled", "zabbix"]
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.4-latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: postgres
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-zabbix}
      PHP_TZ: ${TIMEZONE:-Asia/Seoul}
      ZBX_SERVER_NAME: MORI SOC-lite
      # Zabbix LDAP — Zabbix 웹 UI > 관리 > 인증 > LDAP 에서도 설정 가능
      # 환경변수는 컨테이너 최초 기동 시 zabbix.conf.php 에 반영됩니다.
      ZBX_LDAP_ENABLED: ${ZABBIX_LDAP_ENABLED:-false}
      ZBX_LDAP_SERVER: ${ZABBIX_LDAP_SERVER:-openldap}
      ZBX_LDAP_PORT: ${ZABBIX_LDAP_PORT:-389}
      ZBX_LDAP_STARTTLS: "0"
      ZBX_LDAP_BASE_DN: ${ZABBIX_LDAP_BASE_DN:-ou=users,dc=mori,dc=local}
      ZBX_LDAP_SEARCH_ATTRIBUTE: ${ZABBIX_LDAP_SEARCH_ATTRIBUTE:-uid}
      ZBX_LDAP_BIND_DN: ${ZABBIX_LDAP_BIND_DN:-cn=admin,dc=mori,dc=local}
      ZBX_LDAP_BIND_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin}
    ports:
      - "${ZABBIX_WEB_PORT:-18081}:8080"
    networks: [soc]

  mysql:
    profiles: ["bundled", "fleet"]
    image: mysql:8.0
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${FLEET_DB_ROOT_PASSWORD:-fleet_root}
      MYSQL_DATABASE: ${FLEET_DB_NAME:-fleet}
      MYSQL_USER: ${FLEET_DB_USER:-fleet}
      MYSQL_PASSWORD: ${FLEET_DB_PASSWORD:-fleet}
    volumes:
      - fleet-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [soc]

  redis:
    profiles: ["bundled", "fleet"]
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - fleet-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [soc]

  fleet-init:
    profiles: ["bundled", "fleet"]
    image: alpine:3.20
    command: sh -c "mkdir -p /logs /vulndb && chown -R 100:101 /logs /vulndb"
    volumes:
      - fleet-logs:/logs
      - fleet-vulndb:/vulndb

  fleet:
    profiles: ["bundled", "fleet"]
    image: fleetdm/fleet
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      fleet-init:
        condition: service_completed_successfully
    command: sh -c "/usr/bin/fleet prepare db --no-prompt && /usr/bin/fleet serve"
    environment:
      FLEET_REDIS_ADDRESS: redis:6379
      FLEET_MYSQL_ADDRESS: mysql:3306
      FLEET_MYSQL_DATABASE: ${FLEET_DB_NAME:-fleet}
      FLEET_MYSQL_USERNAME: ${FLEET_DB_USER:-fleet}
      FLEET_MYSQL_PASSWORD: ${FLEET_DB_PASSWORD:-fleet}
      FLEET_SERVER_ADDRESS: 0.0.0.0:1337
      FLEET_SERVER_TLS: "false"
      FLEET_SERVER_PRIVATE_KEY: ${FLEET_SERVER_PRIVATE_KEY:-change_me}
      FLEET_LOGGING_JSON: "true"
      FLEET_OSQUERY_STATUS_LOG_PLUGIN: filesystem
      FLEET_FILESYSTEM_STATUS_LOG_FILE: /logs/osqueryd.status.log
      FLEET_FILESYSTEM_RESULT_LOG_FILE: /logs/osqueryd.results.log
      FLEET_OSQUERY_LABEL_UPDATE_INTERVAL: 1h
      FLEET_VULNERABILITIES_CURRENT_INSTANCE_CHECKS: "yes"
      FLEET_VULNERABILITIES_DATABASES_PATH: /vulndb
      FLEET_VULNERABILITIES_PERIODICITY: 1h
    ports:
      - "${FLEET_PORT:-1337}:1337"
    volumes:
      - fleet-data:/fleet
      - fleet-logs:/logs
      - fleet-vulndb:/vulndb
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:1337/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [soc]

  wazuh.manager:
    profiles: ["bundled", "wazuh"]
    image: wazuh/wazuh-manager:4.14.4
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      INDEXER_URL: https://wazuh.indexer:9200
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      FILEBEAT_SSL_VERIFICATION_MODE: full
      SSL_CERTIFICATE_AUTHORITIES: /etc/ssl/wazuh/root-ca-manager.pem
      SSL_CERTIFICATE: /etc/ssl/wazuh/wazuh.manager.pem
      SSL_KEY: /etc/ssl/wazuh/wazuh.manager-key.pem
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    volumes:
      - wazuh-api-configuration:/var/ossec/api/configuration
      - wazuh-etc:/var/ossec/etc
      - wazuh-logs:/var/ossec/logs
      - wazuh-queue:/var/ossec/queue
      - wazuh-var-multigroups:/var/ossec/var/multigroups
      - wazuh-integrations:/var/ossec/integrations
      - wazuh-active-response:/var/ossec/active-response/bin
      - wazuh-agentless:/var/ossec/agentless
      - wazuh-wodles:/var/ossec/wodles
      - filebeat-etc:/etc/filebeat
      - filebeat-var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs:/etc/ssl/wazuh:ro
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf:ro
    networks: [soc]

  wazuh.indexer:
    profiles: ["bundled", "wazuh"]
    image: wazuh/wazuh-indexer:4.14.4
    hostname: wazuh.indexer
    restart: unless-stopped
    environment:
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs:/usr/share/wazuh-indexer/config/certs:ro
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml:ro
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml:ro
    networks: [soc]

  wazuh.dashboard:
    profiles: ["bundled", "wazuh"]
    image: wazuh/wazuh-dashboard:4.14.4
    hostname: wazuh.dashboard
    restart: unless-stopped
    depends_on:
      - wazuh.indexer
    environment:
      INDEXER_USERNAME: admin
      INDEXER_PASSWORD: SecretPassword
      WAZUH_API_URL: https://wazuh.manager
      DASHBOARD_USERNAME: kibanaserver
      DASHBOARD_PASSWORD: kibanaserver
      API_USERNAME: wazuh-wui
      API_PASSWORD: MyS3cr37P450r.*-
    ports:
      - "127.0.0.1:${WAZUH_DASHBOARD_PORT:-8443}:5601"
    volumes:
      - ./config/wazuh_indexer_ssl_certs:/usr/share/wazuh-dashboard/certs:ro
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    networks: [soc]

  trivy:
    image: aquasec/trivy:latest
    profiles: [scanner]
    command: ["filesystem", "--cache-dir", "/trivy-cache", "--format", "table", "/workspace"]
    volumes:
      - ./:/workspace:ro
      - trivy-cache:/trivy-cache

