[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info

[INPUT]
    Name          tail
    Path          /host/var/log/*.log,/host/var/log/*/*.log
    Tag           host.logs
    Refresh_Interval 10
    Read_from_Head true
    Skip_Long_Lines On

[INPUT]
    Name          tail
    Path          /fleet-logs/osqueryd.status.log
    Tag           fleet.status
    Refresh_Interval 10
    Read_from_Head true
    Skip_Long_Lines On

[INPUT]
    Name          tail
    Path          /fleet-logs/osqueryd.results.log
    Tag           fleet.results
    Refresh_Interval 10
    Read_from_Head true
    Skip_Long_Lines On

[OUTPUT]
    Name          loki
    Match         host.logs
    Host          loki
    Port          3100
    Labels        job=fluent-bit,source=host
    Line_Format   key_value

[OUTPUT]
    Name          loki
    Match         fleet.status
    Host          loki
    Port          3100
    Labels        job=fleetdm,source=fleet,log_type=status
    Line_Format   json

[OUTPUT]
    Name          loki
    Match         fleet.results
    Host          loki
    Port          3100
    Labels        job=fleetdm,source=fleet,log_type=result
    Line_Format   json
