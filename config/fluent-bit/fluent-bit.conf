[SERVICE]
    Flush         5
    Daemon        Off
    Log_Level     info

[INPUT]
    Name          tail
    Path          /host/var/log/*.log,/host/var/log/*/*.log
    Tag           host.logs
    Refresh_Interval 10
    Read_from_Head true
    Skip_Long_Lines On

[OUTPUT]
    Name          loki
    Match         *
    Host          loki
    Port          3100
    Labels        job=fluent-bit,source=host
    Line_Format   key_value
