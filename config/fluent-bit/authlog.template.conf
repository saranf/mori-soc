# ─────────────────────────────────────────────────────────────────────────────
# MORI 접속기록(access-record) 전용 fluent-bit 템플릿
#
# 목적: 리눅스 인증로그(sshd/su/sudo 로그인)를 **전용 라벨 job=authlog** 로 Loki에
#       적재해, MORI가 LogQL로 "접속기록"만 깔끔히 조회·증적화(안전조치 제8조)하게 한다.
#       현재 기본 fluent-bit.conf 는 /host/var/log/*.log 를 job=fluent-bit,source=host 로
#       한데 섞어 보내므로, 접속기록만 별도 라벨로 분리하기 위한 추가 블록이다.
#
# 사용: 이 파일 내용을 config/fluent-bit/fluent-bit.conf 에 이어붙이거나 @INCLUDE 한다.
#       (auth.log = Debian/Ubuntu, secure = RHEL/CentOS 계열)
# 검증필요: 경로·호스트 마운트(/host/var/log)는 배포 환경에 맞게 조정.
# ─────────────────────────────────────────────────────────────────────────────

[INPUT]
    Name          tail
    Path          /host/var/log/auth.log,/host/var/log/secure
    Tag           authlog
    Refresh_Interval 10
    Read_from_Head true
    Skip_Long_Lines On
    # 접속기록만 남기고 잡음 제거는 아래 FILTER(grep)에서

[FILTER]
    Name   grep
    Match  authlog
    # 로그인 성공/실패·권한상승만 통과 (sshd Accepted/Failed, sudo, su)
    Regex  log (Accepted|Failed) password|sshd.*session (opened|closed)|sudo:.*COMMAND|su(do)?:.*(session|authentication)

[OUTPUT]
    Name          loki
    Match         authlog
    Host          loki
    Port          3100
    Labels        job=authlog,source=host,record=access
    Line_Format   key_value
