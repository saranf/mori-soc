# ─────────────────────────────────────────────────────────────────────────────
# MORI 접속기록(access-record) — Zabbix 에이전트 로그 모니터링 템플릿
#
# 목적: Loki 파이프라인 대신(또는 병행) **Zabbix 에이전트가 인증로그를 직접 수집**하는
#       경로. Zabbix 서버가 log[] 아이템으로 로그인 이벤트를 히스토리에 보관하면,
#       MORI가 기존 Zabbix API 플러밍(_api_call)으로 history.get / auditlog.get 를
#       호출해 접속기록 증적을 만든다(안전조치 제8조 / ISMS-P 2.9.4 / ISO A.8.15).
#
# 사용: zabbix_agent2 active 설정에 포함(@Include) 후, Zabbix UI에서 아래 키로 log 아이템
#       (타입=Zabbix agent(active), 값형식=Log)을 생성한다. active 체크가 필요하므로
#       ServerActive= 가 설정돼 있어야 한다.
# 검증필요: 로그 경로·권한(zabbix 사용자가 /var/log/secure 읽기), 아이템은 UI/템플릿에서 생성.
# ─────────────────────────────────────────────────────────────────────────────

# 로그인 성공/실패만 수집(정규식 필터). RHEL 계열은 /var/log/secure, Debian 계열은 auth.log.
#   아이템 키 예시(UI에서 생성):
#     log[/var/log/secure,"(Accepted|Failed) password",,,skip]
#     log[/var/log/auth.log,"(Accepted|Failed) password|sudo:.*COMMAND",,,skip]
#
# UserParameter 대안 — 최근 1일 로그인 성공/실패 건수를 숫자로 노출(추세·월간점검용):
UserParameter=mori.authlog.accepted,grep -c "Accepted password" /var/log/secure /var/log/auth.log 2>/dev/null | awk -F: '{s+=$2} END{print s+0}'
UserParameter=mori.authlog.failed,grep -c "Failed password" /var/log/secure /var/log/auth.log 2>/dev/null | awk -F: '{s+=$2} END{print s+0}'

# ── Zabbix 자체 접속기록(관리콘솔 접근)은 서버 측 auditlog 에 남는다 ──
#   MORI 수집 방법: Zabbix API `auditlog.get` (Zabbix 6.0+) — 누가/언제 로그인·설정변경했는지.
#   에이전트 설정 불필요, MORI collector 확장으로 처리(문서 docs/ACCESS_LOG_EVIDENCE.md 참고).
