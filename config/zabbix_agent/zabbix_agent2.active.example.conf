### MORI SOC-lite Zabbix Agent 2 active-mode example
### Copy this file to your PC and adjust Hostname / HostMetadata as needed.

Server=mori.rmstudio.co.kr
ServerActive=mori.rmstudio.co.kr:10051

### Must match the Host name created in Zabbix Web.
Hostname=CHANGE_ME_HOSTNAME

### Example values: windows / linux / macos
HostMetadata=CHANGE_ME_METADATA

### Active checks tuning
RefreshActiveChecks=120
BufferSend=5
BufferSize=100
HeartbeatFrequency=60

### Recommended security defaults
EnableRemoteCommands=0
LogRemoteCommands=0

### Optional: enable if you want to include local overrides
# Include=./zabbix_agent2.d/*.conf