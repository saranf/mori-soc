# MORI HTTPS 가상호스트 — 이미 호스트 443 을 쥔 nginx 에 SNI(server_name)로 얹는다.
# 포트 충돌 없음: 같은 80/443 을 쓰되 server_name 으로 mori.rmstudio.co.kr 만 골라 MORI(:18000)로 프록시.
# 사용: 이 파일을 그 nginx 의 conf.d 에 넣고 → certbot 로 인증서 발급 → nginx -s reload.

# (1) 80 — ACME 챌린지 + HTTPS 리다이렉트
server {
    listen 80;
    listen [::]:80;
    server_name mori.rmstudio.co.kr;

    # certbot webroot 챌린지 (인증서 발급/갱신용)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

# (2) 443 — TLS 종단 후 MORI 로 프록시
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mori.rmstudio.co.kr;

    ssl_certificate     /etc/letsencrypt/live/mori.rmstudio.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mori.rmstudio.co.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 25m;   # SARIF/증적 업로드 여유

    # MORI 컨테이너는 호스트 18000 에 published. 프록시 nginx 가:
    #  - 호스트 설치형이면        → 127.0.0.1:18000
    #  - 컨테이너(브리지)면        → 172.17.0.1:18000 (docker0 게이트웨이) 로 바꾼다.
    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
