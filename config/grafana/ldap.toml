################################################################################
# Grafana LDAP 인증 설정
# OpenLDAP (docker-compose openldap 서비스) 와 연동합니다.
#
# 활성화 방법:
#   .env 파일에 GRAFANA_LDAP_ENABLED=true 추가 후 Grafana 재시작
#
# 기본 LDAP 구조 (phpLDAPadmin 에서 생성 필요):
#   dc=mori,dc=local
#   └── ou=users
#       ├── uid=alice   (cn=Alice, memberOf=cn=security,ou=groups,...)
#       └── uid=bob     (cn=Bob,   memberOf=cn=viewer,ou=groups,...)
#   └── ou=groups
#       ├── cn=admin
#       ├── cn=security
#       └── cn=viewer
################################################################################

[[servers]]
host    = "openldap"
port    = 389
use_ssl = false
start_tls = false

# 바인드 계정 (읽기 전용 서비스 계정 권장)
bind_dn       = "cn=admin,dc=mori,dc=local"
bind_password = "${LDAP_ADMIN_PASSWORD}"

# 사용자 검색 베이스 & 필터
search_base_dn = "ou=users,dc=mori,dc=local"
search_filter  = "(uid=%s)"

# 속성 매핑
[servers.attributes]
name      = "cn"
surname   = "sn"
username  = "uid"
member_of = "memberOf"
email     = "mail"

# 그룹 → Grafana 역할 매핑
# Grafana 역할: Viewer / Editor / Admin
[[servers.group_mappings]]
group_dn      = "cn=admin,ou=groups,dc=mori,dc=local"
org_role      = "Admin"
grafana_admin = true

[[servers.group_mappings]]
group_dn = "cn=security,ou=groups,dc=mori,dc=local"
org_role = "Editor"

[[servers.group_mappings]]
group_dn = "cn=viewer,ou=groups,dc=mori,dc=local"
org_role = "Viewer"

# 그룹 미매핑 사용자 기본 역할 (Viewer 또는 "" 로 로그인 거부)
[[servers.group_mappings]]
group_dn = "*"
org_role = "Viewer"

